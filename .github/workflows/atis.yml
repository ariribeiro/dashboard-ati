name: Dados ATI

on:
  schedule:
    - cron: "0 12 15 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês ('mais recente' busca o último publicado; 'ano inteiro' processa todos os meses publicados do ano)"
        type: choice
        default: mais recente
        options:
          - mais recente
          - ano inteiro
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
          - "12"
      ano:
        description: "Ano com 4 dígitos (obrigatório com mês específico ou 'ano inteiro')"
        type: string
        default: ""
      force:
        description: "Reprocessar o mês mesmo se já existir"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dados agregados
        env:
          MES: ${{ inputs.mes }}
          ANO: ${{ inputs.ano }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$MES" ] && [ "$MES" != "mais recente" ]; then
            if ! [[ "$ANO" =~ ^20[0-9]{2}$ ]]; then
              echo "::error::Informe o ano com 4 dígitos (ex.: 2026) ao escolher o mês ou 'ano inteiro'."
              exit 1
            fi
            if [ "$MES" = "ano inteiro" ]; then
              args+=(--ano "$ANO")
            else
              args+=(--mes "${ANO}${MES}")
            fi
          elif [ -n "$ANO" ]; then
            echo "::error::Escolha o mês junto com o ano."
            exit 1
          fi
          [ "$FORCE" = "true" ] && args+=(--force)
          python scripts/gerar_atis.py "${args[@]}"

      - name: Commitar data/ se houver mudança
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças em data/."
          else
            # Meses alterados neste run (ex.: "2026-03"), não necessariamente o mais recente.
            refs=$(git diff --cached --name-only -- 'data/[0-9]*.json' \
              | sed -E 's#data/([0-9]{4})([0-9]{2})\.json#\1-\2#' | paste -sd ' ' -)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "dados ATI ${refs:-índice}"
            git push
          fi

      - name: Montar site
        run: |
          cp -r data site/data
          # Versiona JS/CSS pelo commit para o navegador não misturar versões em cache.
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
