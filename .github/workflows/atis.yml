name: Dados ATI

on:
  schedule:
    - cron: "0 12 15 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocessar o mês mesmo se já existir"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar dados agregados
        run: python scripts/gerar_atis.py ${{ inputs.force && '--force' || '' }}

      - name: Commitar data/ se houver mudança
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças em data/."
          else
            ref=$(python -c "import json; print(json.load(open('data/latest.json'))['referencia'])")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "dados ATI ${ref}"
            git push
          fi

      - name: Montar site
        run: |
          cp -r data site/data
          # Versiona JS/CSS pelo commit para o navegador não misturar versões em cache.
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
